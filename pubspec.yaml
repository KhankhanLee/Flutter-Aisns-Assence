name: assence
description: A new Flutter ai sns project.

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  image_picker: ^1.1.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  characters: ^1.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - images/Hayeon/
    - images/Suyeon/
    - images/Jiun/
    - images/Naeun/

  fonts:
    - family: Billabong
      fonts:
        - asset: assets/fonts/Billabong.ttf
    - family: Aveny
      fonts:
        - asset: assets/fonts/AvenyTRegular.otf
          style: normal
        - asset: assets/fonts/AvenyTMedium.otf
          style: italic

# 아이콘·시작 화면 원본은 tool/render_brand_assets.dart로 생성한다.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
  web: false
